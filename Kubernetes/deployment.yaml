apiVersion: apps/v1
kind: Deployment

metadata:
  name: zomato
  labels:
    app: zomato

spec:
  replicas: 2

  selector:
    matchLabels:
      app: zomato

  template:
    metadata:
      labels:
        app: zomato

    spec:
      containers:
      - name: zomato
        image: 267673636065.dkr.ecr.ap-south-1.amazonaws.com/zomato-kastro:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 3000
